org.gradle.jvmargs=-Xmx3G -XX:MaxMetaspaceSize=1G -XX:ReservedCodeCacheSize=512m -XX:+HeapDumpOnOutOfMemoryError
android.useAndroidX=true
android.enableJetifier=true
# The receive_sharing_intent Android module pins its Java compilation to 1.8
# while its Kotlin defaults to the JDK target (21); Gradle's strict JVM-target
# check then fails the build. Downgrade that check to a warning — D8 dexes the
# mixed class-file versions to Android bytecode, so it's harmless at runtime.
kotlin.jvm.target.validation.mode=warning
